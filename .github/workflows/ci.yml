name: Tier 1 CI

on:
  push:
    branches: [main, feat/*, "release/**"]
  pull_request:
    branches: [main, "release/**"]

env:
  OPENSCREEN_TEST_HEADLESS: "1"

jobs:
  ubuntu-full-verification:
    name: Ubuntu 24.04 (Full Verification Engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y -qq \
            mesa-vulkan-drivers \
            libvulkan-dev \
            xvfb \
            pulseaudio \
            ffmpeg \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Verify Zig formatting
        run: zig fmt --check build.zig build.zig.zon src/ tests/ tools/

      - name: Setup Test Fixtures (Whisper & ONNX Runtime Linux)
        run: |
          mkdir -p tests/fixtures/models tests/fixtures/onnx
          if [ ! -f tests/fixtures/models/ggml-tiny.en.bin ]; then
            curl -sL "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" -o tests/fixtures/models/ggml-tiny.en.bin
          fi
          if [ ! -f tests/fixtures/onnx/libonnxruntime.so ]; then
            curl -sL "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.27.1/microsoft.ml.onnxruntime.1.27.1.nupkg" -o /tmp/ort.zip
            unzip -q -o /tmp/ort.zip "runtimes/linux-x64/native/libonnxruntime.so" -d /tmp/ort
            cp /tmp/ort/runtimes/linux-x64/native/libonnxruntime.so tests/fixtures/onnx/libonnxruntime.so
          fi

      - name: Build openscreen binary (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Validate 17 Locales (i18n completeness)
        run: zig build i18n-check

      - name: Run unit tests (0 memory leaks)
        run: zig build test

      - name: Run Gate 6 offscreen desktop GUI tests
        run: xvfb-run -a zig build test-ui

      - name: Run Gate 6B Native Desktop GUI smoke test (X11 event loop under Xvfb)
        run: xvfb-run -a ./zig-out/bin/openscreen --test-gui-smoke

      - name: Run golden pixel & SSIM tests (GPU + CPU fallback)
        run: xvfb-run -a zig build test-golden

      - name: Run E2E integration tests
        run: xvfb-run -a zig build test-e2e

      - name: Verify Gate 3 MP4 with ffprobe
        run: |
          ffprobe -v error -show_format -show_streams /tmp/gate3_render_10s.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 /tmp/gate3_render_10s.mp4 | grep -q "h264"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 /tmp/gate3_render_10s.mp4 | grep -q "aac"
          V_DUR=$(ffprobe -v error -select_streams v:0 -show_entries stream=duration -of default=noprint_wrappers=1:nokey=1 /tmp/gate3_render_10s.mp4)
          echo "Video duration: $V_DUR"
          python3 -c "import sys; dur = float('$V_DUR'); sys.exit(0 if 9.95 <= dur <= 10.05 else 1)"
          A_DUR=$(ffprobe -v error -select_streams a:0 -show_entries stream=duration -of default=noprint_wrappers=1:nokey=1 /tmp/gate3_render_10s.mp4)
          echo "Audio duration: $A_DUR"
          python3 -c "import sys; dur = float('$A_DUR'); sys.exit(0 if 9.95 <= dur <= 10.05 else 1)"

      - name: Verify Gate 4 Cursor Diagnostics
        run: |
          zig build cursor-diag
          ./zig-out/bin/cursor-diag /tmp/gate4_capture_live.cursor.jsonl

      - name: Verify Gate 4 Captured MP4 with ffprobe
        run: |
          ffprobe -v error -show_format -show_streams /tmp/gate4_test_export.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 /tmp/gate4_test_export.mp4 | grep -q "h264"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 /tmp/gate4_test_export.mp4 | grep -q "aac"

      - name: Render Visual Proof Screenshots (HUD, Editor LTR, Editor RTL)
        run: zig build render-screenshots

      - name: Upload UI Visual Proof Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-proof-screenshots
          path: screenshots/*.png

  windows-parity:
    name: Windows (WinRT / WGC Parity)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Setup FFmpeg LGPL (Windows)
        run: |
          New-Item -ItemType Directory -Force -Path "C:\tmp" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegDir = Get-ChildItem -Path "ffmpeg_extracted" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "lib"
          New-Item -ItemType Directory -Force -Path "include"
          New-Item -ItemType Directory -Force -Path "zig-out\bin"
          Copy-Item "$($ffmpegDir.FullName)\lib\*.lib" -Destination "lib\" -Force
          Copy-Item "$($ffmpegDir.FullName)\include\*" -Destination "include\" -Recurse -Force
          Copy-Item "$($ffmpegDir.FullName)\bin\*.dll" -Destination "." -Force
          Copy-Item "$($ffmpegDir.FullName)\bin\*.dll" -Destination "zig-out\bin\" -Force
          echo "$($ffmpegDir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$((Get-Location).Path)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Test Fixtures (Whisper & ONNX Runtime Windows)
        run: |
          New-Item -ItemType Directory -Force -Path "tests/fixtures/models"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" -OutFile "tests/fixtures/models/ggml-tiny.en.bin"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.27.1/microsoft.ml.onnxruntime.1.27.1.nupkg" -OutFile "ort.zip"
          Expand-Archive -Path "ort.zip" -DestinationPath "ort_extracted"
          Copy-Item "ort_extracted\runtimes\win-x64\native\onnxruntime.dll" -Destination "." -Force
          Copy-Item "ort_extracted\runtimes\win-x64\native\onnxruntime.dll" -Destination "zig-out\bin\" -Force

      - name: Build openscreen binary
        run: zig build -Doptimize=ReleaseSafe

      - name: Add wgpu DLL to PATH and working directory
        run: |
          $wgpuDll = Get-ChildItem -Path . -Recurse -Filter "wgpu_native.dll" | Select-Object -First 1
          if ($wgpuDll) {
            Write-Host "Found wgpu_native.dll at $($wgpuDll.FullName)"
            Copy-Item $wgpuDll.FullName -Destination . -Force
            $dir = $wgpuDll.DirectoryName
            echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Run unit tests
        run: zig build test

      - name: Run Gate 6 offscreen desktop GUI tests
        run: zig build test-ui

      - name: Run golden pixel tests (D3D12 WARP + CPU fallback)
        run: zig build test-golden

      - name: Run E2E integration tests
        run: zig build test-e2e

  macos-parity:
    name: macOS (ScreenCaptureKit Parity)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install system dependencies (macOS)
        run: |
          brew install ffmpeg

      - name: Setup Test Fixtures (Whisper & ONNX Runtime macOS)
        run: |
          mkdir -p tests/fixtures/models tests/fixtures/onnx
          curl -sL "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" -o tests/fixtures/models/ggml-tiny.en.bin
          curl -sL "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.27.1/microsoft.ml.onnxruntime.1.27.1.nupkg" -o /tmp/ort.zip
          unzip -q -o /tmp/ort.zip "runtimes/osx-*/native/libonnxruntime.dylib" -d /tmp/ort
          cp /tmp/ort/runtimes/osx-*/native/libonnxruntime.dylib tests/fixtures/onnx/libonnxruntime.dylib 2>/dev/null || true

      - name: Build openscreen binary
        run: zig build -Doptimize=ReleaseSafe

      - name: Run unit tests
        run: zig build test

      - name: Run Gate 6 offscreen desktop GUI tests
        run: zig build test-ui

      - name: Run golden pixel tests (CPU fallback)
        run: zig build test-golden

      - name: Run E2E integration tests
        run: zig build test-e2e
